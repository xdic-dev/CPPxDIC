name: CI

on:
  push:
    branches: [main, newversion]
  pull_request:
    branches: [main, newversion]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with CppNCorr submodule)
        uses: actions/checkout@v4
        with:
          # Only the CppNCorr submodule is reachable in CI; the MultiDIC
          # submodule lives on a private remote, so we init selectively below.
          submodules: false

      - name: Init CppNCorr submodule
        run: git submodule update --init --recursive Tools/CppNCorr

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential \
            libopencv-dev \
            libfftw3-dev \
            libmatio-dev \
            libhdf5-dev \
            libcgal-dev \
            libeigen3-dev \
            libsuitesparse-dev \
            liblapack-dev libblas-dev \
            libomp-dev \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure || echo "ctest returned non-zero (no tests registered is acceptable)"

  lint:
    name: Lint (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install clang-format 18.1.8
        run: |
          python3 -m pip install --user "clang-format==18.1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting of branch-added sources
        run: |
          clang-format --version
          # Lint only files added/changed on this branch relative to origin/main.
          git fetch origin main --depth=1 || true
          BASE=$(git merge-base origin/main HEAD || echo "")
          if [ -z "$BASE" ]; then
            FILES=$(git ls-files 'src/*.cpp' 'src/*.h' 'include/*.h')
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'src/*.cpp' 'src/*.h' 'include/*.h')
          fi
          if [ -z "$FILES" ]; then
            echo "No branch-added C++ sources to lint."
            exit 0
          fi
          echo "Linting:"
          echo "$FILES"
          clang-format --dry-run --Werror $FILES

  coverage:
    name: Coverage (gcov → Codecov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with CppNCorr submodule)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init CppNCorr submodule
        run: git submodule update --init --recursive Tools/CppNCorr

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential \
            libopencv-dev \
            libfftw3-dev \
            libmatio-dev \
            libhdf5-dev \
            libcgal-dev \
            libeigen3-dev \
            libsuitesparse-dev \
            liblapack-dev libblas-dev \
            libomp-dev \
            nlohmann-json3-dev \
            gcovr

      - name: Configure (coverage instrumentation)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_C_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure || echo "ctest returned non-zero (continuing for coverage)"

      - name: Generate coverage report (Cobertura XML)
        run: >
          gcovr --root .
          --exclude 'Tools/'
          --exclude 'tests/'
          --exclude 'build/'
          --xml-pretty --output coverage.xml
          --print-summary || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: cppxdic-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
