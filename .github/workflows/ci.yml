# =============================================================================
# CPPxDIC CI — build, test, lint.
#
# Triggers on push and PR to `main` and `newversion`. Kept fast: no GPU, no dataset
# downloads. The heavy DIC/3D dependencies (OpenCV, CGAL, matio, HDF5, SuiteSparse, …)
# are apt-installed in the build/test jobs. The CppNCorr / MultiDIC submodules MUST be
# checked out (submodules: recursive) because cppxdic compiles CppNCorr in-tree.
# =============================================================================
name: CI

on:
  push:
    branches: [main, newversion]
  pull_request:
    branches: [main, newversion]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shared dependency-install step is duplicated per job (composite actions avoided to keep
# this single-file and reviewable). Ubuntu 24.04 package names.
env:
  APT_DEPS: >-
    build-essential cmake pkg-config
    libopencv-dev libcgal-dev libeigen3-dev libmatio-dev libhdf5-dev
    libfftw3-dev libsuitesparse-dev liblapack-dev libblas-dev
    nlohmann-json3-dev libomp-dev

jobs:
  build:
    name: build (camera-pairs, GCC, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules (CppNCorr + cuNCorr, compiled in-tree)
        # CppNCorr and cuNCorr are public repos under the same org (https URLs), so the
        # persisted token fetches them. Tools/MultiDIC is a separate private repo the CI
        # runner cannot clone, so we do NOT recurse all submodules (that would fail the
        # checkout) — we name only what cppxdic builds. Non-recursive: cuNCorr's own nested
        # CppNCorr is not needed here (cppxdic builds ncorr; CUNCORR_BUILD_CPPNCORR=OFF).
        run: git submodule update --init Tools/CppNCorr Tools/cuNCorr
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.APT_DEPS }}
      - name: Configure (camera-pairs, tests off, cuNCorr adapter test on)
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DXDIC_MODE=camerapairs
          -DBUILD_TESTING=OFF
          -DBUILD_CUNCORR_ADAPTER_TEST=ON
      - name: Build cppxdic (+ cuNCorr integration)
        run: cmake --build build -j"$(nproc)" --target cppxdic cuncorr_adapter_test
        # NOTE: cppxdic links the concurrently-developed CppNCorr submodule. If the build
        # fails inside Tools/CppNCorr/, that is a submodule issue, not a CPPxDIC regression.
      - name: Verify the cuNCorr -> ncorr adapter (synthetic recovery)
        # Exercises run_cuncorr_dic end to end: builds a known-translation frame pair,
        # runs the cuNCorr engine (CPU backend on CI), and checks the packaged
        # ncorr::DIC_analysis_output recovers it — proving the adapter/grid mapping.
        run: ./build/cuncorr_adapter_test

  test:
    name: test (unit + integration on ohtcfrp via ctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init CppNCorr submodule (compiled in-tree)
        # See the build job: only CppNCorr is built; MultiDIC is unreachable in CI.
        run: git submodule update --init Tools/CppNCorr
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.APT_DEPS }}
      - name: Configure with tests
        # ncorr-only: the ohtcfrp e2e guard uses golden statistics tuned for the CppNCorr
        # engine. cuNCorr is a different algorithm (different numbers), so keep it off here;
        # the build job compiles + adapter-tests the cuNCorr integration separately.
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DXDIC_MODE=camerapairs
          -DBUILD_TESTING=ON
          -DCPPXDIC_USE_CUNCORR=OFF
      - name: Build test suite
        # Build only the cppxdic_core test library + test executables (not the full cppxdic
        # binary) so the test job stays fast and is independent of the heavy main target.
        run: >-
          cmake --build build -j"$(nproc)" --target
          test_config test_xdic_mode test_image_folder_reader test_delaunay
          test_temporal_filter test_face_isotropy test_surface_stitching
          test_it3_ohtcfrp_fixture test_integration_skipped test_e2e_ohtcfrp
      - name: Run ctest (unit + integration + 2D e2e)
        working-directory: build
        run: ctest --output-on-failure
        # SKIPPED-IN-CI rationale:
        #   - Stereo 3D integration tests (IT-1,2,4,5,6,7) and the full stereo pipeline
        #     (E2E-2) are registered as SKIPPED inside the suite: they need a multi-camera
        #     calibration + video dataset that is too large for CI and not present in-repo.
        #   - E2E-1 runs here: it is the 2D-path regression guard on the lightweight ohtcfrp
        #     example (frame discovery/decode + golden statistics with tolerance bands).
        #   - Two filterTime() invariants are SKIPPED (known production instability, tracked
        #     separately). Skips keep the suite green while gaps stay explicit.

  lint:
    name: lint (clang-format on files added by this branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff against the base branch
      - name: Install clang-format (pinned)
        run: python3 -m pip install --quiet "clang-format==18.1.8"
      - name: clang-format added C/C++ files
        run: |
          set -euo pipefail
          # Always use the pinned pip binary explicitly: the runner image also ships
          # a (different-major) clang-format on PATH, which would disagree with the
          # version used to format the tree.
          CF="$(python3 -c 'import clang_format, os; print(os.path.join(os.path.dirname(clang_format.__file__), "data", "bin", "clang-format"))')"
          "$CF" --version
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "${BASE}" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Diffing against ${BASE}"
          # Lint only files ADDED by this branch (the new code, kept clang-format
          # clean). Pre-existing files that were merely modified (e.g. the mechanical
          # Points3D->Point3DFrame type rename) are intentionally not reformatted
          # wholesale here. Never touch the submodules under Tools/.
          FILES=$(git diff --name-only --diff-filter=A "${BASE}" HEAD \
                    | grep -E '\.(c|cc|cpp|cxx|h|hpp|hxx)$' \
                    | grep -v '^Tools/' || true)
          if [ -z "${FILES}" ]; then
            echo "No added C/C++ files to lint."
            exit 0
          fi
          echo "Linting:"; echo "${FILES}"
          "$CF" --dry-run --Werror ${FILES}

  coverage:
    name: coverage (gcov → Codecov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init CppNCorr submodule (compiled in-tree)
        # See the build job: only CppNCorr is built; MultiDIC is unreachable in CI.
        run: git submodule update --init Tools/CppNCorr
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.APT_DEPS }} gcovr
      - name: Configure (coverage instrumentation)
        # ncorr-only (see the test job): coverage tracks the CppNCorr golden path.
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DXDIC_MODE=camerapairs
          -DBUILD_TESTING=ON
          -DCPPXDIC_USE_CUNCORR=OFF
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_C_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build test suite (instrumented)
        run: >-
          cmake --build build -j"$(nproc)" --target
          test_config test_xdic_mode test_image_folder_reader test_delaunay
          test_temporal_filter test_face_isotropy test_surface_stitching
          test_it3_ohtcfrp_fixture test_integration_skipped test_e2e_ohtcfrp
      - name: Run ctest
        working-directory: build
        run: ctest --output-on-failure || echo "ctest returned non-zero (continuing for coverage)"
      - name: Generate coverage report (Cobertura XML)
        run: >-
          gcovr --root .
          --exclude 'Tools/'
          --exclude 'tests/'
          --exclude 'build/'
          --xml-pretty --output coverage.xml
          --print-summary || true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: cppxdic-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
