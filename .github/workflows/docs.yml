name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deployment; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Doxygen docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Doxygen + Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/doxygen/html

  check_pages:
    name: Check GitHub Pages status
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages_status.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages_status
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput('enabled', 'true');
              core.info('GitHub Pages is enabled.');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('enabled', 'false');
                core.warning('GitHub Pages is not enabled for this repository; skipping deployment.');
              } else {
                throw error;
              }
            }

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, check_pages]
    if: needs.check_pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
