# =============================================================================
# CPPXDIC unified default configuration (config-file tier of the override chain)
# -----------------------------------------------------------------------------
# Format: INI-style `key = value`, one per line.
#   - Lines beginning with `#` are comments; blank lines are ignored.
#   - Lists are comma-separated (e.g. nfcond_set = 5,6).
#   - Booleans accept: true/false, 1/0, yes (case-insensitive).
#
# Override chain (lowest -> highest priority):
#   1. Compiled defaults  (Config member initializers in include/config.h)
#   2. THIS file          (loaded via --config / -C, default config/default.cfg)
#   3. Specific files     (dic_params.txt, ncorr_params.txt, visualization_params.txt)
#   4. CLI arguments      (e.g. --subject, --reftrial)
#
# Every value below mirrors the compiled default in include/config.h. Uncomment and
# edit any line to override that default; commented lines fall through to the default.
# =============================================================================

# ---- Global parameters ----
# frictional_conditions = glass,coating,coating_oil   # friction condition labels
# num_pair = 2                       # number of stereo camera pairs
# robot_sample_freq = 1000.0         # robot sampling frequency (Hz)
# vid_sample_freq = 50.0             # image/video sampling frequency (Hz)

# ---- Paths ----
# base_path = /Users/jaoga/devlab/MultiDIC   # project base path
# data_path =                        # location of video + protocol files (empty = derived)
# dic_path =                         # location of DIC output data (empty = derived)

# ---- Processing flags ----
# im_filter_mode = true              # apply image filtering
# automatic_process = true           # automatic processing
# parallel_processing = true         # enable parallel processing
# debug_mode = true                  # verbose debug output

# ---- DIC parameters ----
# subject_id = S09                   # subject identifier
# phase_id = loading                 # phase identifier
# material_id = 2                    # material identifier
# nfcond_set = 5                     # condition numbers (comma-separated)
# spddxlcond_set = 0.04,0.08         # speed conditions (comma-separated)
# calib_folder_set = 2               # calibration folder
# ref_trial_id = 5                   # reference trial number

# ---- Frame selection ----
# idx_frame_start = 10               # first frame index (1-based)
# idx_frame_end = 150                # last frame index
# frame_jump = 1                     # frame stride

# ---- Units / subregion ----
# units_per_pixel = 0.2              # e.g. mm per pixel
# subregion_radius = 20              # default subset radius (pixels)
# limit_grayscale = 70               # grayscale limit threshold

# ---- Visualization (mirrors optStructPlot) ----
# showvisu = false                   # show visualization
# mapLogic = true                    # enable 3D map plotting
# plotopt = Epc1,Epc2                # face measurement plot options
# deftype = both                     # derivative order: cum|rate|both
# viewplot = below                   # perspective: lateralR|below|lateralL|front
# contactAreaLogic = false           # contact-area delimitation
# gapLogic = true                    # suppress stitched pair boundary
# maxCorrCoeff = 10.0                # max admissible correlation coefficient
# format = small                     # plot format: small|normal

# ---- Filtering ----
# smoothTimeLogic = true             # temporal smoothing of maps
# filterFreq = 5.0                   # temporal cut-off frequency (Hz)
# smoothSpaceLogic = true            # spatial smoothing of maps
# smoothPar_n = 30                   # spatial filter parameter 1
# smoothPar_sigma = 2.0              # spatial filter parameter 2

# ---- Additional plot settings ----
# showRobotLogic = true              # plot kinematic/dynamic data
# showImgLogic = false               # plot image
# camNbr = 0                         # camera number (0 = default)
# tracesLogic = false                # plot traces (deprecated)
# FaceAlpha = 1.0                    # face transparency (0-1)
# lineColor = none                   # line color: none|k|b|...
# quiverScaleFactor = 20.0           # arrow scale factor for vector plots

# ---- Output / export ----
# export_format = vtk                # export format: vtk|ply|csv
# export_each_frame = false          # export each frame separately
# fileversion = v2                   # deformation file version
# data_format = mat                  # pipeline I/O format: mat|bin|json

# ---- Step E / Step F specifics ----
# step_e_distortion_removal = false  # remove distortion from 2D points
# step_d_replacebadcorr = true       # replace bad correlation subsets
# step_f_temporal_filtering = true   # temporal filtering of displacements
# step_f_freq_filt = 10.0            # low-pass cutoff (Hz) for temporal filter
# step_f_compute_rbm = false         # compute rigid body motion / ARBM

# ---- NCorr parameters (mirrors ncorr_params.txt) ----
# ncorr_scalefactor = 3              # scale factor
# ncorr_interp = quintic_bspline_precompute   # interpolation method
# ncorr_subregion = circle           # subregion shape
# ncorr_dic_config = no_update       # DIC config mode
# ncorr_cutoff_corrcoef = 10.0       # correlation cutoff
# ncorr_roi_update_mode = none       # ROI update mode
# ncorr_accumulation_mode = none     # accumulation mode
# ncorr_save_disps_steps = false     # save intermediate displacements
# ncorr_perspective_interp = false   # perspective interpolation
# ncorr_units = mm                   # units string
# ncorr_seeds_are_optimized = true   # optimized seeds
# ncorr_cutoff_max_diffnorm = 1e-5   # max diff-norm cutoff
# ncorr_cutoff_max_corrcoef = 10.0   # max corr-coef cutoff
# ncorr_threads = 4                  # number of DIC threads
# ncorr_use_exact_matlab = false     # use exact MATLAB DIC chain composition

# ---- VTK export ----
# vtk_format = ascii                 # VTK format: ascii|binary
# vtk_include_scalars = true         # include scalar data in VTK
# vtk_include_vectors = true         # include vector data in VTK

# ---- PLY export ----
# ply_format = ascii                 # PLY format: ascii|binary
# ply_include_colors = true          # include colors in PLY

# ---- CSV export ----
# csv_delimiter = ,                  # CSV delimiter
# csv_include_header = true          # include header in CSV

# ---- Video output ----
# generate_videos = true             # generate videos
# video_fps = 10                     # video FPS
# video_codec = MJPG                 # video codec
# video_quality = 90                 # video quality (0-100)
# video_alpha = 1.0                  # video overlay transparency

# ---- Colormap ----
# colormap = jet                     # colormap name
# colormap_range_mode = auto         # range mode: auto|manual
# colormap_min = 0.0                 # manual colormap min
# colormap_max = 1.0                 # manual colormap max
# colormap_levels = 256              # number of color levels

# ---- Statistics ----
# generate_summary_stats = true      # generate summary statistics
# stats_format = txt                 # stats format: txt|csv|json
# stats_per_frame = true             # per-frame statistics
# stats_spatial = true               # spatial statistics
# stats_temporal = true              # temporal statistics

# ---- Advanced mesh / display ----
# mesh_decimation = 1.0              # mesh decimation factor (1.0 = none)
# mesh_smoothing = false             # enable mesh smoothing
# mesh_smoothing_iterations = 10     # smoothing iterations
# show_axes = true                   # show axes
# show_colorbar = true               # show colorbar
# show_grid = false                  # show grid
# background_color = white           # background color
