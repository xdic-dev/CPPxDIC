# Codecov configuration for CPPxDIC
# https://docs.codecov.com/docs/codecovyml-reference
codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        # Don't block PRs on small coverage dips while the suite stabilises.
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

# Paths excluded from coverage accounting.
ignore:
  - "Tools/**"        # vendored CppNCorr / MultiDIC submodules
  - "tests/**"        # test harness code
  - "build/**"
