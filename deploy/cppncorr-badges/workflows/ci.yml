name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential \
            libopencv-dev \
            libfftw3-dev \
            libsuitesparse-dev \
            liblapack-dev libblas-dev \
            libomp-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure || echo "ctest returned non-zero (no tests registered is acceptable)"

  coverage:
    name: Coverage (gcov → Codecov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential \
            libopencv-dev \
            libfftw3-dev \
            libsuitesparse-dev \
            liblapack-dev libblas-dev \
            libomp-dev \
            gcovr

      - name: Configure (coverage instrumentation)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_C_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure || echo "ctest returned non-zero (continuing for coverage)"

      - name: Generate coverage report (Cobertura XML)
        run: >
          gcovr --root .
          --exclude 'build/'
          --exclude 'test/'
          --exclude 'tests/'
          --xml-pretty --output coverage.xml
          --print-summary || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: cppncorr-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
